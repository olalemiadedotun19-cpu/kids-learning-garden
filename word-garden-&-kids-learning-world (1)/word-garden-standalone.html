<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Garden & Kids Learning World</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-sky-300 via-sky-200 to-emerald-200 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Web Audio Synthesizer
    let audioCtx = null;
    function playSound(type, freq = 440) {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        if (type === 'click' || type === 'pop') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'fanfare' || type === 'star') {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((f, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, now + idx * 0.08);
            gain.gain.setValueAtTime(0.2, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.3);
          });
        } else if (type === 'note') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.5);
        }
      } catch(e){}
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.88;
      u.pitch = 1.1;
      window.speechSynthesis.speak(u);
    }

    const FLASHCARDS = [
      { letter: 'A', word: 'Apple', image: 'https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=600&auto=format&fit=crop&q=80', sentence: 'An apple a day keeps the doctor away!' },
      { letter: 'B', word: 'Ball', image: 'https://images.unsplash.com/photo-1519861531473-9200262188bf?w=600&auto=format&fit=crop&q=80', sentence: 'Bounce the colorful ball high in the sky!' },
      { letter: 'C', word: 'Cat', image: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600&auto=format&fit=crop&q=80', sentence: 'The soft fluffy cat says meow!' },
      { letter: 'D', word: 'Dog', image: 'https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=600&auto=format&fit=crop&q=80', sentence: 'The playful puppy wags his happy tail!' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('word-garden');
      const [stars, setStars] = useState(125);
      const [gems, setGems] = useState(30);
      const [cardIndex, setCardIndex] = useState(0);

      const currentCard = FLASHCARDS[cardIndex];

      const triggerReward = () => {
        playSound('fanfare');
        if (window.confetti) window.confetti({ particleCount: 70, spread: 60 });
        setStars(s => s + 10);
        setGems(g => g + 2);
      };

      return (
        <div className="min-h-screen p-4 flex flex-col items-center select-none max-w-6xl mx-auto">
          {/* Header */}
          <header className="w-full flex items-center justify-between py-2 mb-4">
            <div className="flex items-center gap-3">
              <div className="w-16 h-16 rounded-full bg-amber-400 p-1 border-2 border-white shadow-lg overflow-hidden">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&auto=format&fit=crop&q=80" className="w-full h-full object-cover rounded-full" />
              </div>
              <div className="bg-white/90 border-2 border-indigo-200 rounded-2xl px-4 py-2 shadow-md">
                <p className="font-bold text-sm text-indigo-950">Hello there! 👋</p>
                <p className="text-xs text-indigo-700">Let's learn something new today!</p>
              </div>
            </div>

            <div className="bg-amber-800 text-amber-100 px-6 py-2 rounded-2xl border-4 border-amber-600 shadow-xl font-black text-xl">
              Word Garden
            </div>

            <div className="flex items-center gap-3">
              <div className="bg-white/90 px-3 py-1.5 rounded-2xl border-2 border-amber-300 font-extrabold text-amber-900 shadow">
                ⭐ {stars}
              </div>
              <div className="bg-white/90 px-3 py-1.5 rounded-2xl border-2 border-purple-300 font-extrabold text-purple-900 shadow">
                💎 {gems}
              </div>
            </div>
          </header>

          {/* Main Flashcard View */}
          <main className="w-full bg-[#FFFDF5] border-8 border-amber-300 rounded-[3rem] shadow-2xl p-8 flex flex-col md:flex-row items-center justify-between gap-8 relative">
            <button 
              onClick={() => { playSound('click'); setCardIndex((cardIndex - 1 + FLASHCARDS.length) % FLASHCARDS.length); }}
              className="absolute left-4 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-purple-600 text-white font-black text-2xl flex items-center justify-center shadow-lg hover:scale-110 active:scale-95 transition-transform"
            >
              ‹
            </button>

            <button 
              onClick={() => { playSound('click'); setCardIndex((cardIndex + 1) % FLASHCARDS.length); }}
              className="absolute right-4 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-purple-600 text-white font-black text-2xl flex items-center justify-center shadow-lg hover:scale-110 active:scale-95 transition-transform"
            >
              ›
            </button>

            <div className="flex-1 text-center md:text-left pl-8">
              <span className="text-9xl font-black text-red-500 font-sans tracking-tight drop-shadow-lg">
                {currentCard.letter}
              </span>
              <p className="text-3xl font-extrabold text-indigo-950 mt-2">
                <span className="text-red-500">{currentCard.letter}</span> is for
              </p>
              <h2 className="text-6xl font-black text-indigo-950 mt-1">
                <span className="text-red-500">{currentCard.word.charAt(0)}</span>{currentCard.word.slice(1)}
              </h2>
            </div>

            <div className="flex-1 flex flex-col items-center justify-center pr-8">
              <div className="w-64 h-64 rounded-3xl overflow-hidden border-4 border-amber-200 shadow-xl mb-4">
                <img src={currentCard.image} className="w-full h-full object-cover" />
              </div>
              <button 
                onClick={() => { playSound('pop'); speakText(`${currentCard.letter} is for ${currentCard.word}`); }}
                className="px-6 py-3 bg-purple-600 hover:bg-purple-500 text-white font-black rounded-2xl shadow-lg transition-transform active:scale-95"
              >
                🔊 Listen
              </button>
            </div>
          </main>

          {/* Bottom Interaction */}
          <div className="w-full mt-6 flex items-center justify-between bg-white/90 border-4 border-amber-300 rounded-full px-8 py-4 shadow-xl">
            <button 
              onClick={() => { triggerReward(); speakText(`Great job saying ${currentCard.word}!`); }}
              className="px-8 py-3 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-black text-lg rounded-2xl shadow-lg hover:scale-105 active:scale-95 transition-transform"
            >
              🎤 Can you say {currentCard.word}?
            </button>
            <p className="text-emerald-600 font-black text-lg">Tap microphone to practice & earn +10 ⭐!</p>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
